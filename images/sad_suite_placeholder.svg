<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Style block for embedded styles -->
  <style>
    .bg { fill: #0F131C; }
    .grid { stroke: #1F2937; stroke-width: 1; stroke-dasharray: 4 4; }
    .accent-grid { stroke: #10B981; stroke-width: 0.5; stroke-dasharray: 2 10; opacity: 0.3; }
    .window-header { fill: #0B0E14; stroke: #1F2937; stroke-width: 1; }
    .circle-red { fill: #EF4444; }
    .circle-yellow { fill: #F59E0B; }
    .circle-green { fill: #10B981; }
    .text-title { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 24px; font-weight: bold; fill: #F3F4F6; }
    .text-subtitle { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 14px; fill: #10B981; font-weight: 600; letter-spacing: 0.1em; }
    .text-body { font-family: 'Sora', 'Segoe UI', sans-serif; font-size: 14px; fill: #9CA3AF; }
    .text-code { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 11px; fill: #6B7280; }
    .badge-bg { fill: rgba(16, 185, 129, 0.1); stroke: rgba(16, 185, 129, 0.3); stroke-width: 1; }
    .badge-text { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #10B981; }
    .ui-panel { fill: #05070B; stroke: #1F2937; stroke-width: 1; }
    .ui-accent-line { stroke: #10B981; stroke-width: 2; }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="600" />

  <!-- Grid Pattern -->
  <g>
    <!-- Vertical Grid Lines -->
    <line x1="100" y1="0" x2="100" y2="600" class="grid" />
    <line x1="200" y1="0" x2="200" y2="600" class="grid" />
    <line x1="300" y1="0" x2="300" y2="600" class="grid" />
    <line x1="400" y1="0" x2="400" y2="600" class="grid" />
    <line x1="500" y1="0" x2="500" y2="600" class="grid" />
    <line x1="600" y1="0" x2="600" y2="600" class="grid" />
    <line x1="700" y1="0" x2="700" y2="600" class="grid" />

    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="100" x2="800" y2="100" class="grid" />
    <line x1="0" y1="200" x2="800" y2="200" class="grid" />
    <line x1="0" y1="300" x2="800" y2="300" class="grid" />
    <line x1="0" y1="400" x2="800" y2="400" class="grid" />
    <line x1="0" y1="500" x2="800" y2="500" class="grid" />
  </g>

  <!-- Accent Vertical/Horizontal lines -->
  <line x1="150" y1="0" x2="150" y2="600" class="accent-grid" />
  <line x1="0" y1="250" x2="800" y2="250" class="accent-grid" />

  <!-- Mock Desktop Application Window UI -->
  <g transform="translate(40, 50)">
    <!-- Window Base Frame -->
    <rect width="720" height="500" rx="8" fill="#0B0E14" stroke="#1F2937" stroke-width="1.5" />

    <!-- Window Header -->
    <path d="M 8 0 L 712 0 A 8 8 0 0 1 720 8 L 720 40 L 0 40 L 0 8 A 8 8 0 0 1 8 0 Z" class="window-header" />

    <!-- Window Controls Circles -->
    <circle cx="20" cy="20" r="6" class="circle-red" />
    <circle cx="40" cy="20" r="6" class="circle-yellow" />
    <circle cx="60" cy="20" r="6" class="circle-green" />

    <!-- Window Title -->
    <text x="360" y="25" text-anchor="middle" class="text-code" fill="#9CA3AF">sad-desktop-suite -- v2.0.26 -- offline-first</text>

    <!-- UI Sidebar Menu Panel -->
    <rect x="0" y="40" width="180" height="460" class="ui-panel" />
    <line x1="180" y1="40" x2="180" y2="500" stroke="#1F2937" stroke-width="1" />

    <!-- Sidebar Active Selection Line -->
    <line x1="0" y1="90" x2="0" y2="130" class="ui-accent-line" />

    <!-- Sidebar Items (Mock) -->
    <rect x="15" y="60" width="150" height="20" rx="3" fill="rgba(255,255,255,0.02)" />
    <text x="25" y="74" class="text-code" fill="#10B981">SYSTEM OVERVIEW</text>

    <text x="25" y="114" class="text-code" fill="#F3F4F6">⚙️ BIZCORE</text>
    <text x="25" y="154" class="text-code" fill="#9CA3AF">🎓 EDUCORE</text>
    <text x="25" y="194" class="text-code" fill="#9CA3AF">🏥 MEDICORE</text>
    <text x="25" y="234" class="text-code" fill="#9CA3AF">🏨 STAYCORE</text>
    <text x="25" y="274" class="text-code" fill="#9CA3AF">🔒 SECURITY PATH</text>

    <!-- Main Panel Content Area -->
    <!-- Card 1: System Telemetry Mockup -->
    <rect x="200" y="60" width="500" height="150" rx="6" class="ui-panel" />
    <line x1="200" y1="60" x2="700" y2="60" class="ui-accent-line" />

    <text x="220" y="95" class="text-title">SAD Desktop Suite</text>
    <text x="220" y="125" class="text-subtitle">OFFLINE-FIRST CORE SYSTEMS FOR GHANA</text>
    <text x="220" y="155" class="text-body" fill="#9CA3AF">Tailored suite built with Electron, React, and SQLite for maximum local reliability.</text>

    <!-- Status Badge -->
    <rect x="530" y="80" width="150" height="24" rx="4" class="badge-bg" />
    <text x="605" y="96" text-anchor="middle" class="badge-text">ACTIVE DEVELOPMENT</text>

    <!-- Card 2: Interactive Grid of Core Modules -->
    <g transform="translate(200, 230)">
      <!-- Box 1: BizCore -->
      <rect x="0" y="0" width="240" height="100" rx="6" class="ui-panel" />
      <text x="15" y="25" class="text-code" fill="#10B981">[MODULE 01]</text>
      <text x="15" y="50" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">BizCore Systems</text>
      <text x="15" y="75" class="text-code">Inventory &amp; Local Sales Ledger</text>

      <!-- Box 2: EduCore -->
      <rect x="260" y="0" width="240" height="100" rx="6" class="ui-panel" />
      <text x="275" y="25" class="text-code" fill="#9CA3AF">[MODULE 02]</text>
      <text x="275" y="50" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">EduCore Systems</text>
      <text x="275" y="75" class="text-code">Registries &amp; Tuition Tracking</text>

      <!-- Box 3: MediCore -->
      <rect x="0" y="120" width="240" height="100" rx="6" class="ui-panel" />
      <text x="15" y="145" class="text-code" fill="#9CA3AF">[MODULE 03]</text>
      <text x="15" y="170" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">MediCore Systems</text>
      <text x="15" y="195" class="text-code">Local Patient Queue Registers</text>

      <!-- Box 4: StayCore -->
      <rect x="260" y="120" width="240" height="100" rx="6" class="ui-panel" />
      <text x="275" y="145" class="text-code" fill="#9CA3AF">[MODULE 04]</text>
      <text x="275" y="170" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">StayCore Systems</text>
      <text x="275" y="195" class="text-code">Hotel Bookings &amp; Occupancy Logs</text>
    </g>

    <!-- Bottom Telemetry String -->
    <text x="200" y="480" class="text-code">&gt;_ System local database (SQLite) synchronized securely. UI builds initialized via Electron-main process.</text>
  </g>

  <!-- Watermark watermark -->
  <text x="760" y="580" text-anchor="end" class="text-code" style="opacity: 0.2;">SUCCESS ABOVE DREAMS</text>
</svg>