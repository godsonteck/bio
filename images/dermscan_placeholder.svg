<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Style block for embedded styles -->
  <style>
    .bg { fill: #0F131C; }
    .grid { stroke: #1F2937; stroke-width: 1; stroke-dasharray: 4 4; }
    .accent-grid { stroke: #10B981; stroke-width: 0.5; stroke-dasharray: 2 10; opacity: 0.3; }
    .text-title { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 24px; font-weight: bold; fill: #F3F4F6; }
    .text-subtitle { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 14px; fill: #10B981; font-weight: 600; letter-spacing: 0.1em; }
    .text-body { font-family: 'Sora', 'Segoe UI', sans-serif; font-size: 14px; fill: #9CA3AF; }
    .text-code { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 11px; fill: #6B7280; }
    .badge-bg { fill: rgba(16, 185, 129, 0.1); stroke: rgba(16, 185, 129, 0.3); stroke-width: 1; }
    .badge-text { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #10B981; }
    .ui-panel { fill: #05070B; stroke: #1F2937; stroke-width: 1; }
    .ui-accent-line { stroke: #10B981; stroke-width: 2; }
    .phone-body { fill: #0B0E14; stroke: #374151; stroke-width: 4; }
    .phone-screen { fill: #05070B; stroke: #1F2937; stroke-width: 1.5; }
    .scanner-line { stroke: #10B981; stroke-width: 2.5; stroke-linecap: round; opacity: 0.8; filter: drop-shadow(0 0 4px #10B981); }
    .camera-notch { fill: #1F2937; }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="600" />

  <!-- Grid Pattern -->
  <g>
    <!-- Vertical Grid Lines -->
    <line x1="100" y1="0" x2="100" y2="600" class="grid" />
    <line x1="200" y1="0" x2="200" y2="600" class="grid" />
    <line x1="300" y1="0" x2="300" y2="600" class="grid" />
    <line x1="400" y1="0" x2="400" y2="600" class="grid" />
    <line x1="500" y1="0" x2="500" y2="600" class="grid" />
    <line x1="600" y1="0" x2="600" y2="600" class="grid" />
    <line x1="700" y1="0" x2="700" y2="600" class="grid" />

    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="100" x2="800" y2="100" class="grid" />
    <line x1="0" y1="200" x2="800" y2="200" class="grid" />
    <line x1="0" y1="300" x2="800" y2="300" class="grid" />
    <line x1="0" y1="400" x2="800" y2="400" class="grid" />
    <line x1="0" y1="500" x2="800" y2="500" class="grid" />
  </g>

  <!-- Accent Grid Line -->
  <line x1="550" y1="0" x2="550" y2="600" class="accent-grid" />
  <line x1="0" y1="350" x2="800" y2="350" class="accent-grid" />

  <!-- Information Section (Left) -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="440" height="480" fill="transparent" />

    <text x="10" y="50" class="text-title">DermScan AI Platform</text>
    <text x="10" y="80" class="text-subtitle">INTELLIGENT SKIN HEALTH SCANNER</text>

    <!-- Project Description -->
    <text x="10" y="130" class="text-body" fill="#F3F4F6">Accessible healthcare research on the go.</text>
    <text x="10" y="160" class="text-body" fill="#9CA3AF">An advanced image scanner designed to analyze and identify</text>
    <text x="10" y="185" class="text-body" fill="#9CA3AF">skin concerns. Powered by custom trained algorithms,</text>
    <text x="10" y="210" class="text-body" fill="#9CA3AF">optimized for fast operations on mobile devices.</text>

    <!-- Metadata Panel -->
    <rect x="10" y="250" width="400" height="150" rx="6" class="ui-panel" />
    <line x1="10" y1="250" x2="410" y2="250" class="ui-accent-line" />

    <text x="30" y="285" class="text-code" fill="#10B981">MODEL STATUS:</text>
    <text x="150" y="285" class="text-code" fill="#F3F4F6">Active Research &amp; Tuning</text>

    <text x="30" y="320" class="text-code" fill="#10B981">TARGET FRAMEWORK:</text>
    <text x="150" y="320" class="text-code" fill="#F3F4F6">Flutter • Python • TensorFlow</text>

    <text x="30" y="355" class="text-code" fill="#10B981">DEVELOPED BY:</text>
    <text x="150" y="355" class="text-code" fill="#9CA3AF">Emmanuel Drah — "SAD"</text>

    <!-- Research Phase Badge -->
    <rect x="10" y="420" width="130" height="24" rx="4" class="badge-bg" />
    <text x="75" y="436" text-anchor="middle" class="badge-text">RESEARCH PHASE</text>

    <text x="10" y="475" class="text-code">&gt;_ Initial imaging algorithms verified against standard clinical datasets.</text>
  </g>

  <!-- Phone Mockup Frame (Right) -->
  <g transform="translate(510, 50)">
    <!-- Main phone body outline -->
    <rect width="250" height="500" rx="30" class="phone-body" />

    <!-- Speaker / Notch -->
    <rect x="85" y="12" width="80" height="18" rx="9" class="camera-notch" />
    <circle cx="100" cy="21" r="3" fill="#10B981" />

    <!-- Phone Screen viewport -->
    <rect x="12" y="40" width="226" height="420" rx="20" class="phone-screen" />

    <!-- Mock UI Elements inside phone -->
    <text x="125" y="75" text-anchor="middle" class="text-code" fill="#10B981" font-size="10">DERMSCAN AI INITIALIZED</text>

    <!-- Scan Area Target Box -->
    <rect x="33" y="110" width="160" height="180" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Mock skin representation or abstract scanning nodes -->
    <path d="M 60 180 Q 90 140 120 190 T 180 170" fill="none" stroke="#374151" stroke-width="2" />
    <circle cx="120" cy="190" r="4" fill="#EF4444" />
    <line x1="120" y1="190" x2="160" y2="230" stroke="#EF4444" stroke-width="1" stroke-dasharray="2 2" />
    <text x="165" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444">[TARGET AREA]</text>

    <!-- Glowing Scan Line -->
    <line x1="33" y1="160" x2="193" y2="160" class="scanner-line" />

    <!-- Lower controls inside mock app -->
    <rect x="33" y="315" width="160" height="30" rx="5" class="ui-panel" />
    <text x="113" y="334" text-anchor="middle" class="text-code" fill="#F3F4F6" font-size="10">🔍 RE-SCAN IN PROGRESS</text>

    <circle cx="113" cy="385" r="22" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1.5" />
    <circle cx="113" cy="385" r="16" fill="#10B981" />

    <!-- Home indicator bar -->
    <rect x="75" y="482" width="100" height="4" rx="2" fill="#374151" />
  </g>

  <!-- Watermark watermark -->
  <text x="760" y="580" text-anchor="end" class="text-code" style="opacity: 0.2;">SUCCESS ABOVE DREAMS</text>
</svg>