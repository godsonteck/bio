<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Emmanuel Drah</title>
    <meta name="description" content="Get in touch with Emmanuel Drah. Let's build something amazing together.">
    <meta property="og:title" content="Contact — Emmanuel Drah">
    <meta property="og:description" content="Get in touch with Emmanuel Drah. Let's build something amazing together.">
    <meta property="og:image" content="https://emmanueldrah.netlify.app/images/sad.jpg">
    <meta property="og:url" content="https://emmanueldrah.netlify.app/contact.html">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://emmanueldrah.netlify.app/contact.html">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/components.js" defer></script>
    <script src="js/contact.js" defer></script>
    <style>
        .contact-form {
            background: var(--bg-card);
            padding: clamp(1.5rem, 5vw, 3rem);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .form-group {
            margin-bottom: 2rem;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        input, textarea {
            width: 100%;
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-light);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
    </style>
</head>
<body>
    <custom-cursor></custom-cursor>
    <portfolio-nav></portfolio-nav>

    <main>
        <section class="hero" style="min-height: 40vh;">
            <div class="hero-text">
                <span class="section-tag">Let's Connect</span>
                <h1>Let's build <span class="text-gradient">together.</span></h1>
                <p style="margin-top: 1rem; opacity: 0.8; line-height: 1.6;">Whether you have a specific project in mind or just want to chat about the future of tech in Ghana, my door is always open. You can reach me directly at <a href="tel:+233543671806" style="color: var(--accent); font-weight: 700;">+233 543 671 806</a> or drop a message below.</p>
            </div>
        </section>

        <section>
            <div style="max-width: 800px; margin: 0 auto;">
                <div id="form-message" style="display: none; padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center; font-weight: 700;"></div>
                <form class="contact-form" id="contactForm" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
                    <p style="display: none;">
                        <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
                    </p>
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Your Vision</label>
                        <textarea id="message" name="message" rows="5" placeholder="Tell me about what you're building, your goals, or even just a quick 'hello'..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
                        <span id="btnText">Send Message</span>
                        <div id="btnSpinner" style="display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite;"></div>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <portfolio-footer></portfolio-footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
