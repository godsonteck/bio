<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Emmanuel Drah</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-form {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .form-group {
            margin-bottom: 2rem;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        input, textarea {
            width: 100%;
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-light);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">
            <img src="images/sad.jpg" alt="SAD Logo" class="logo-img">
            <div class="brand-info">
                <span class="brand-name">Emmanuel Drah</span>
                <span class="brand-tag">Success Above Dreams</span>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Portfolio</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html" class="active">Contact</a>
            <button class="btn-theme" id="theme-btn">🌙</button>
        </div>
    </nav>

    <main>
        <section class="hero" style="min-height: 40vh;">
            <div class="hero-text">
                <span class="section-tag">Let's Connect</span>
                <h1>Start a <span class="text-gradient">Project.</span></h1>
            </div>
        </section>

        <section>
            <div style="max-width: 800px; margin: 0 auto;">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" rows="5" placeholder="Tell me about your vision..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <img src="images/sad.jpg" alt="SAD Logo">
                <span style="font-weight: 800; font-size: 1.2rem;">Emmanuel Drah</span>
            </div>
            <div class="social-links">
                <a href="https://github.com/godsonteck">GitHub</a>
                <a href="mailto:emmanueldrah10@gmail.com">Email</a>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
