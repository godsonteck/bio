<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say Hello — Emmanuel Drah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">SAD.</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">My Story</a>
            <a href="projects.html">Work</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Say Hello</a>
            <button class="theme-toggle" id="theme-btn" aria-label="Switch Theme">🌙</button>
        </div>
    </nav>

    <main>
        <section class="hero" style="min-height: 50vh; padding-top: 10rem;">
            <div class="hero-content">
                <span class="hero-tagline">Contact</span>
                <h1>Let's start a<br><span class="serif">conversation.</span></h1>
            </div>
        </section>

        <section id="contact-form-section" style="max-width: 800px; margin: 0 auto;">
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 3rem;">
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                    <label for="name" style="text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; display: block; margin-bottom: 1rem;">What is your name?</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required style="width: 100%; border: none; background: transparent; font-size: 1.5rem; font-family: 'Cormorant Garamond', serif; color: var(--text-main); outline: none;">
                </div>
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                    <label for="email" style="text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; display: block; margin-bottom: 1rem;">Where can I reach you?</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required style="width: 100%; border: none; background: transparent; font-size: 1.5rem; font-family: 'Cormorant Garamond', serif; color: var(--text-main); outline: none;">
                </div>
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                    <label for="message" style="text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; display: block; margin-bottom: 1rem;">Tell me about your project</label>
                    <textarea id="message" name="message" rows="4" placeholder="I have an idea..." required style="width: 100%; border: none; background: transparent; font-size: 1.5rem; font-family: 'Cormorant Garamond', serif; color: var(--text-main); outline: none; resize: none;"></textarea>
                </div>
                <div style="margin-top: 2rem;">
                    <button type="submit" style="background: var(--text-main); color: var(--bg-page); padding: 1.2rem 4rem; border: none; font-weight: 700; border-radius: 100px; cursor: pointer; transition: var(--transition);">Send Message</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-socials">
            <a href="https://github.com/godsonteck">GitHub</a>
            <a href="mailto:emmanueldrah10@gmail.com">Email</a>
        </div>
        <p class="footer-copy">&copy; 2026 Emmanuel Drah.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
