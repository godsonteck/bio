<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Emmanuel Drah</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            transition: var(--transition);
        }
        .gallery-item img {
            width: 100%;
            border-radius: 4px;
            box-shadow: var(--shadow);
            cursor: zoom-in;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        .masonry {
            column-count: 3;
            column-gap: 2rem;
        }
        @media (max-width: 900px) { .masonry { column-count: 2; } }
        @media (max-width: 600px) { .masonry { column-count: 1; } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">SAD.</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">My Story</a>
            <a href="projects.html">Work</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Say Hello</a>
            <button class="theme-toggle" id="theme-btn" aria-label="Switch Theme">🌙</button>
        </div>
    </nav>

    <main>
        <section class="hero" style="min-height: 40vh; padding-top: 10rem;">
            <div class="hero-content">
                <span class="hero-tagline">Visual Diary</span>
                <h1>Fragments of <span class="serif">Creation.</span></h1>
            </div>
        </section>

        <section>
            <div class="masonry">
                <div class="gallery-item"><img src="images/alera_screen.jpg" alt="Alera"></div>
                <div class="gallery-item"><img src="images/IMG_6590.JPG" alt="Emmanuel"></div>
                <div class="gallery-item"><img src="images/carp.jpg" alt="Car Rental"></div>
                <div class="gallery-item"><img src="images/alera_2.png" alt="Alera 2"></div>
                <div class="gallery-item"><img src="images/IMG-20251001-WA0109.jpg" alt="Tech Fest"></div>
                <div class="gallery-item"><img src="images/alera_3.png" alt="Alera 3"></div>
                <div class="gallery-item"><img src="images/IMG_6622.JPG" alt="Team"></div>
                <div class="gallery-item"><img src="images/alera_4.png" alt="Alera 4"></div>
                <div class="gallery-item"><img src="images/sad.jpg" alt="SAD"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-socials">
            <a href="https://github.com/godsonteck">GitHub</a>
            <a href="mailto:emmanueldrah10@gmail.com">Email</a>
        </div>
        <p class="footer-copy">&copy; 2026 Emmanuel Drah.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
