<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Emmanuel Drah</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 4/3;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">
            <img src="images/sad.jpg" alt="SAD Logo" class="logo-img">
            <div class="brand-info">
                <span class="brand-name">Emmanuel Drah</span>
                <span class="brand-tag">Success Above Dreams</span>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Portfolio</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="contact.html">Contact</a>
            <button class="btn-theme" id="theme-btn">🌙</button>
        </div>
    </nav>

    <main>
        <section class="hero" style="min-height: 40vh;">
            <div class="hero-text">
                <span class="section-tag">Visuals</span>
                <h1>A Glimpse into the <span class="text-gradient">Process.</span></h1>
            </div>
        </section>

        <section>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="images/alera_screen.jpg" alt="Alera"></div>
                <div class="gallery-item"><img src="images/IMG_6590.JPG" alt="Emmanuel"></div>
                <div class="gallery-item"><img src="images/carp.jpg" alt="Car Rental"></div>
                <div class="gallery-item"><img src="images/alera_2.png" alt="Alera 2"></div>
                <div class="gallery-item"><img src="images/IMG-20251001-WA0109.jpg" alt="Tech Fest"></div>
                <div class="gallery-item"><img src="images/alera_3.png" alt="Alera 3"></div>
                <div class="gallery-item"><img src="images/IMG_6622.JPG" alt="Team"></div>
                <div class="gallery-item"><img src="images/alera_4.png" alt="Alera 4"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <img src="images/sad.jpg" alt="SAD Logo">
                <span style="font-weight: 800; font-size: 1.2rem;">Emmanuel Drah</span>
            </div>
            <div class="social-links">
                <a href="https://github.com/godsonteck">GitHub</a>
                <a href="mailto:emmanueldrah10@gmail.com">Email</a>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
