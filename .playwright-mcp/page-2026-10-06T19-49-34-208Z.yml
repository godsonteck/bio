            - paragraph [ref=f1e116]: The work that counts is the unglamorous kind, done daily, with no audience and no applause. Recognition comes later, if it comes at all. Either way, the work continues.
          - generic [ref=f1e117]:
            - generic [ref=f1e118]: SAD / 03 · Roots
