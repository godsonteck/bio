        - generic [ref=f1e98]: ◆ The Identity & Standard
        - heading "Success is what you build on the days nobody is watching." [level=2] [ref=f1e99]
        - paragraph [ref=f1e100]: Not the loud days. The ordinary ones. That is where the real work happens.
      - generic [ref=f1e101]:
        - generic [ref=f1e102]:
          - text: “
          - paragraph [ref=f1e103]: “A front desk taught me. Health insurance records in Dzodze taught me. Long nights of building taught me. People don’t care about your cleverness. They care whether your work actually helps them.”
          - paragraph [ref=f1e104]: My journey into technology started in childhood, long before I had the tools for it. No computer, no mentor, no money for either, so I learned alone, one stubborn step at a time. Then came the hours at Ho Technical University, the late nights fixing things that refused to work, and the daily practice of watching how real people actually use what I build.
          - paragraph [ref=f1e105]:
            - strong [ref=f1e106]: Success Above Dreams
            - text: "is more than a name. It’s a way of living: act daily, start without permission, stay rooted."
